<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="offscreenTitle">Monitor do ZapDock</title>
    <style>
      html,
      body,
      iframe {
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe
      name="zapdock-monitor"
      title="Monitor de mensagens não lidas do WhatsApp"
      data-i18n-title="offscreenIframeTitle"
      src="https://web.whatsapp.com/"
      allow="autoplay"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <script src="i18n.js"></script>
    <script src="offscreen.js"></script>
  </body>
</html>
